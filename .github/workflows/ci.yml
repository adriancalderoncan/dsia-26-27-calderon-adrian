# Basado en la plantilla del curso (ci_proyecto_i.yml)
name: proyecto-i-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests + coverage gate (>= 60%)
        run: |
          pytest -q \
            --cov=ejercicios.ventas_app \
            --cov=ejercicios.pipeline_ventas \
            --cov=ejercicios.check_metrics \
            --cov=ejercicios.ai_api_client \
            --cov-report=term-missing \
            --cov-fail-under=60
